<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#d500f9"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff9100" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>

  <!-- Outer Neon Ring -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="url(#ringGrad)" stroke-width="28" filter="url(#neonGlow)"/>

  <!-- Audio Waveform / Equalizer Bars in Center -->
  <g transform="translate(512, 512)" filter="url(#neonGlow)">
    <!-- Dynamic waveform bars -->
    <rect x="-240" y="-80" width="32" height="160" rx="16" fill="#00e5ff"/>
    <rect x="-180" y="-140" width="32" height="280" rx="16" fill="#00e5ff"/>
    <rect x="-120" y="-210" width="32" height="420" rx="16" fill="#7c4dff"/>
    <rect x="-60" y="-270" width="32" height="540" rx="16" fill="#d500f9"/>
    <rect x="0" y="-300" width="32" height="600" rx="16" fill="#ff4081"/>
    <rect x="60" y="-250" width="32" height="500" rx="16" fill="#ff9100"/>
    <rect x="120" y="-190" width="32" height="380" rx="16" fill="#ffab00"/>
    <rect x="180" y="-130" width="32" height="260" rx="16" fill="#00e5ff"/>
    <rect x="240" y="-70" width="32" height="140" rx="16" fill="#00e5ff"/>
  </g>

  <!-- Center Vinyl / Core Accent -->
  <circle cx="512" cy="512" r="70" fill="#07090e" stroke="url(#ringGrad)" stroke-width="12"/>
  <circle cx="512" cy="512" r="24" fill="#00e5ff"/>
</svg>
